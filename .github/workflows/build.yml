name: build-apk
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK 27 and link SDK path
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          Write-Host "ANDROID_HOME=$sdk"
          $sm = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sm)) {
            $found = Get-ChildItem "$sdk\cmdline-tools" -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $sm = $found.FullName }
          }
          Write-Host "sdkmanager=$sm"
          & $sm "ndk;27.0.12077973" "cmake;3.22.1"

          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\Android" | Out-Null
          $link = "$env:LOCALAPPDATA\Android\Sdk"
          if (Test-Path $link) { Remove-Item $link -Recurse -Force }
          New-Item -ItemType Junction -Path $link -Target $sdk | Out-Null
          Write-Host "--- ndk under link ---"
          Get-ChildItem "$link\ndk" -ErrorAction SilentlyContinue

      - name: Build MNN native libs
        shell: pwsh
        run: .\build_mnn.ps1

      - name: Assemble debug APK
        run: .\gradlew.bat assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yinyue-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
